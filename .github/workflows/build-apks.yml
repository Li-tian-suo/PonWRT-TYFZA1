name: Build extra APKs

# Builds the third-party applications that do not fit into the 32 MiB rootfs.
# They are produced with CONFIG_PACKAGE_<name>=m in the optional package list and
# can be attached to an existing release without rebuilding the firmware.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to attach the APKs to (leave empty to only upload an artifact)
        required: false
        default: ''
      config_file:
        description: Optional repository path to a custom OpenWrt config
        required: false
        default: 'configs/tyfza1-full.config'

permissions:
  contents: write

concurrency:
  group: apks-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential busybox flex bison gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync unzip zlib1g-dev \
            file wget curl device-tree-compiler u-boot-tools swig libelf-dev \
            python3-pyelftools python3-dev libfuse-dev pkgconf
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
      - name: Obtain locked OpenWrt source
        run: sh port/scripts/prepare.sh sources/openwrt
      - name: Prepare build tree
        env:
          TYFZA1_CONFIG: ${{ inputs.config_file }}
        run: |
          sh port/scripts/sync-overlay.sh sources/openwrt
          sh port/scripts/prepare-extra-packages.sh sources/openwrt
          sh scripts/prepare_luci_feeds.sh sources/openwrt
      - name: Configure
        run: |
          cd sources/openwrt
          make defconfig
          grep -E '^CONFIG_PACKAGE_(luci-app-openclash|luci-app-netspeedtest|homebox|ookla-speedtest)=' .config
      - name: Build host tools
        run: |
          cd sources/openwrt
          make -j"$(nproc)" tools/compile
      - name: Build toolchain
        run: |
          cd sources/openwrt
          make -j"$(nproc)" toolchain/compile
      - name: Build extra packages
        run: |
          cd sources/openwrt
          for pkg in luci-app-openclash luci-app-netspeedtest homebox ookla-speedtest; do
            echo "== building $pkg =="
            if ! make -j"$(nproc)" "package/$pkg/compile"; then
              echo "== retrying $pkg with V=s for diagnostics =="
              make -j1 V=s "package/$pkg/compile" || true
              exit 1
            fi
          done
      - name: Collect APKs
        run: |
          mkdir -p artifacts/packages
          for name in luci-app-openclash luci-app-netspeedtest homebox ookla-speedtest; do
            find sources/openwrt/bin -type f -name "$name-*.apk" -exec cp {} artifacts/packages/ \;
          done
          ls -l artifacts/packages
          test -n "$(ls -A artifacts/packages)"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: extra-apks
          path: artifacts/packages/
          retention-days: 14
      - name: Attach APKs to release
        if: inputs.release_tag != ''
        run: |
          if compgen -G "artifacts/packages/*.apk" >/dev/null; then
            cd artifacts/packages && sha256sum *.apk > SHA256SUMS.apk
            gh release upload "${{ inputs.release_tag }}" *.apk SHA256SUMS.apk \
              --repo "$GITHUB_REPOSITORY" --clobber
          fi
