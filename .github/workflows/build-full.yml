name: Build TYFZA1 Full (custom packages)

# 使用 port/configs/tyfza1-full.config（完整包集合）构建固件。
# 与 build-release.yml 的区别：不创建 Release，只上传 Artifact，方便反复试包。
on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 自定义 OpenWrt config 路径（默认用完整包集合）
        required: false
        default: 'port/configs/tyfza1-full.config'
  push:
    branches:
      - full
      - tyfza1-full

permissions:
  contents: read

concurrency:
  group: firmware-full-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      TYFZA1_CONFIG_FILE: ${{ inputs.config_file || 'port/configs/tyfza1-full.config' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Show chosen config
        run: |
          echo "config_file = $TYFZA1_CONFIG_FILE"
          test -f "$TYFZA1_CONFIG_FILE" || {
            echo "::error::config not found: $TYFZA1_CONFIG_FILE"; exit 1; }
          echo "--- 前 20 行 ---"
          head -n 20 "$TYFZA1_CONFIG_FILE"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential busybox clang-18 llvm-18 lld-18 flex bison gawk \
            gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync unzip \
            zlib1g-dev file wget curl device-tree-compiler u-boot-tools swig \
            libelf-dev python3-pyelftools python3-dev libfuse-dev pkgconf
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc

      - name: Verify LAN initialization and port counters
        run: |
          python3 scripts/test_lan_probe_isolation.py
          python3 scripts/test_lan_async.py
          python3 scripts/test_qspi_poll.py
          python3 scripts/test_lan_pm_mapping.py
          python3 scripts/test_lan_link_mode.py

      - name: Verify storage migration
        run: |
          python3 scripts/test_ubi_storage.py
          python3 scripts/test_storage_boards.py

      - name: Obtain locked OpenWrt source
        run: sh port/scripts/prepare.sh sources/openwrt

      - name: Verify sysupgrade board identities
        run: python3 scripts/test_sysupgrade_board.py

      - name: Prepare OMCI compiler
        run: |
          rustup toolchain install 1.96.1 --profile minimal
          rustup target add --toolchain 1.96.1 aarch64-unknown-linux-musl
          echo "TYFZA1_CARGO=$(rustup which --toolchain 1.96.1 cargo)" >> "$GITHUB_ENV"

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: sources/openwrt/dl
          # 按 ref 分 key：本工作流允许 main 与 full 分支并行构建（concurrency
          # 组是 firmware-full-<ref>），若两者共用同一个 key，会同时命中并同时
          # 尝试保存，先完成的那个写入成功，另一个报 "cache already exists"，
          # 而且存在把不完整 dl 目录存进缓存的风险。
          # restore-keys 保证新分支仍能复用已有下载缓存，只是重新存一份。
          key: openwrt-downloads-${{ runner.os }}-${{ github.ref_name }}-${{ hashFiles('port/sources.lock.json', 'configs/feeds.conf') }}
          restore-keys: |
            openwrt-downloads-${{ runner.os }}-${{ hashFiles('port/sources.lock.json', 'configs/feeds.conf') }}
            openwrt-downloads-${{ runner.os }}-

      - name: Obtain common runtime inputs and signing key
        env:
          FIT_SIGNING_KEY: ${{ secrets.TYFZA1_FIT_SIGNING_KEY }}
        run: |
          mkdir -p artifacts/runtime-inputs artifacts/signing
          gh release download v0.1.0-alpha --repo LeoooChen/PonWRT-TYFZA1 \
            --pattern tyfza1-runtime-inputs-v1.tar.gz --dir artifacts
          tar -xzf artifacts/tyfza1-runtime-inputs-v1.tar.gz -C artifacts/runtime-inputs
          umask 077
          if [ -n "$FIT_SIGNING_KEY" ]; then
            printf '%s\n' "$FIT_SIGNING_KEY" > artifacts/signing/dev.key
          else
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 \
              https://raw.githubusercontent.com/jameywine/GPL-for-GP3000/5090fbcb6ba743dd7b1314811ef557bad0460147/bootloader/Verified_Boot/verifed_key_06-04-2020/dev.key \
              --output artifacts/signing/dev.key
            echo 'bea80932793531fe263f62bf4de3ee95754ea7b9766eda23a418c22f06ce127f  artifacts/signing/dev.key' | sha256sum -c -
          fi
          openssl req -new -x509 -key artifacts/signing/dev.key \
            -out artifacts/signing/dev.crt -subj /CN=TYFZA1-FIT -days 3650

      - name: Build OpenWrt and native PE
        shell: bash
        env:
          TYFZA1_RUNTIME_INPUTS: ${{ github.workspace }}/artifacts/runtime-inputs
          TYFZA1_SIGNING_KEYS: ${{ github.workspace }}/artifacts/signing
        run: |
          export PATH="/usr/lib/llvm-18/bin:$PATH"
          export TYFZA1_CONFIG="$GITHUB_WORKSPACE/$TYFZA1_CONFIG_FILE"
          echo "TYFZA1_CONFIG=$TYFZA1_CONFIG"
          sh port/scripts/build.sh sources/openwrt "$(nproc)" 2>&1 | tee artifacts/build.log

      - name: Report dropped packages
        if: always()
        run: |
          echo "=== 自定义包里实际生效的项 ==="
          while IFS= read -r line; do
            case "$line" in
              CONFIG_PACKAGE_*=y)
                if grep -qxF "$line" sources/openwrt/.config 2>/dev/null; then
                  echo "OK      ${line%%=*}"
                else
                  echo "DROPPED ${line%%=*}"
                fi
                ;;
            esac
          done < "$TYFZA1_CONFIG_FILE"

      - name: Verify built board variants
        run: |
          kernel=$(python3 port/tools/project_paths.py --kernel-directory sources/openwrt)
          python3 scripts/test_board_variants.py --kernel "$kernel"

      - name: Package firmware and installer
        run: |
          sh scripts/package_release.sh sources/openwrt artifacts/release

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: firmware-full-and-build-log
          path: |
            artifacts/release/
            artifacts/build.log
          retention-days: 14
